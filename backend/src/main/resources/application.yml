# All values can be overridden with environment variables (see README).
# The defaults below are for a local development database only.
server:
  port: ${EMS_SERVER_PORT:8080}

spring:
  application:
    name: employee-management
  datasource:
    url: ${EMS_DB_URL:jdbc:postgresql://localhost:5432/employee_management}
    username: ${EMS_DB_USERNAME:ems_user}
    password: ${EMS_DB_PASSWORD:ems_local_password}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entity matches it.
      ddl-auto: validate
  flyway:
    # Remove "classpath:db/seed" (or set EMS_FLYWAY_LOCATIONS) to start without sample data.
    locations: ${EMS_FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}

app:
  security:
    # Single administrator account. Override both for any shared environment;
    # the defaults are for local development only.
    admin-username: ${EMS_ADMIN_USERNAME:admin}
    admin-password: ${EMS_ADMIN_PASSWORD:admin123}
  cors:
    # Comma-separated list of frontend origins allowed to call the API.
    allowed-origins: ${EMS_CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
