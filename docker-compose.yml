# Local PostgreSQL for development. Start with: docker compose up -d
# Credentials are local-only defaults and match backend/src/main/resources/application.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ems-postgres
    environment:
      POSTGRES_DB: ${EMS_DB_NAME:-employee_management}
      POSTGRES_USER: ${EMS_DB_USERNAME:-ems_user}
      POSTGRES_PASSWORD: ${EMS_DB_PASSWORD:-ems_local_password}
    ports:
      - "${EMS_DB_PORT:-5432}:5432"
    volumes:
      - ems-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ems-postgres-data:
